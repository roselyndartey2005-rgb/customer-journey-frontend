<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Client Test Tool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 32px;
    }
    h2 {
      color: #333;
      margin-bottom: 16px;
      font-size: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea {
      font-family: 'Monaco', 'Courier New', monospace;
      min-height: 100px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-right: 8px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 6px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-entry {
      margin-bottom: 8px;
      padding: 4px;
      border-left: 3px solid #555;
      padding-left: 8px;
    }
    .log-entry.success { border-left-color: #10b981; color: #10b981; }
    .log-entry.error { border-left-color: #ef4444; color: #ef4444; }
    .log-entry.info { border-left-color: #3b82f6; color: #3b82f6; }
    .log-entry.warning { border-left-color: #f59e0b; color: #f59e0b; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Tracking Client Test Tool</h1>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-success">0</div>
        <div class="stat-label">Success</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-failed">0</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-duplicate">0</div>
        <div class="stat-label">Duplicates</div>
      </div>
    </div>

    <div class="card">
      <h2>Configuration</h2>
      <div class="form-group">
        <label>Backend API URL</label>
        <input type="text" id="apiUrl" value="https://customer-journey-backend-zo4y.onrender.com">
      </div>
      <div class="form-group">
        <label>Customer Email</label>
        <input type="email" id="email" value="test@example.com">
      </div>
    </div>

    <div class="card">
      <h2>Quick Test Events</h2>
      <button onclick="sendPageView()">📄 Send PAGE_VIEW</button>
      <button onclick="sendClick()">🖱️ Send CLICK</button>
      <button onclick="sendFormSubmit()">📝 Send FORM_SUBMIT</button>
      <button onclick="sendPurchase()">💰 Send PURCHASE</button>
      <button onclick="sendBounce()">⏱️ Send BOUNCE</button>
      <button onclick="sendMinimalEvent()">⚡ Send Minimal Event (Bug #1 Test)</button>
    </div>

    <div class="card">
      <h2>Custom Event</h2>
      <div class="form-group">
        <label>Event Type</label>
        <select id="customEventType">
          <option>PAGE_VIEW</option>
          <option>CLICK</option>
          <option>FORM_SUBMIT</option>
          <option>PURCHASE</option>
          <option>BOUNCE</option>
          <option>NAVIGATION</option>
        </select>
      </div>
      <div class="form-group">
        <label>Custom Payload (JSON)</label>
        <textarea id="customPayload">{"customField": "value"}</textarea>
      </div>
      <button onclick="sendCustomEvent()">Send Custom Event</button>
      <button onclick="sendWithKeepalive()">Send with Keepalive</button>
    </div>

    <div class="card">
      <h2>Stress Test</h2>
      <div class="form-group">
        <label>Number of Events</label>
        <input type="number" id="stressCount" value="10" min="1" max="100">
      </div>
      <div class="form-group">
        <label>Delay (ms)</label>
        <input type="number" id="stressDelay" value="100" min="0" max="5000">
      </div>
      <button onclick="runStressTest()">🚀 Run Stress Test</button>
    </div>

    <div class="card">
      <h2>Event Log</h2>
      <button onclick="clearLog()">Clear Log</button>
      <button onclick="exportLog()">Export Log</button>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    const stats = { total: 0, success: 0, failed: 0, duplicate: 0 };

    function updateStats() {
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-success').textContent = stats.success;
      document.getElementById('stat-failed').textContent = stats.failed;
      document.getElementById('stat-duplicate').textContent = stats.duplicate;
    }

    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function exportLog() {
      const logEl = document.getElementById('log');
      const text = logEl.innerText;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracking-test-log-${Date.now()}.txt`;
      a.click();
    }

    async function sendEvent(eventType, payload = {}, options = {}) {
      const apiUrl = document.getElementById('apiUrl').value;
      const email = document.getElementById('email').value;

      const event = {
        customerId: null,
        anonymousId: 'test-anon-' + Math.random().toString(36).substr(2, 9),
        email: email,
        sessionId: 'test-session-123',
        eventType: eventType,
        occurredAt: new Date().toISOString(),
        sourceSystem: 'web-storefront',
        source: 'test-tool',
        medium: 'none',
        campaignName: 'Test Campaign',
        pageUrl: window.location.href,
        device: 'desktop',
        browser: 'Test',
        ipAddress: null,
        country: null,
        region: null,
        rawPayload: payload,
        eventKey: 'test-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
        durationSeconds: null,
        requireSession: false,
      };

      stats.total++;
      updateStats();

      log(`Sending ${eventType}...`, 'info');

      try {
        const response = await fetch(`${apiUrl}/api/raw-events`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(event),
          keepalive: options.keepalive || false,
        });

        if (!response.ok) {
          const errorText = await response.text().catch(() => 'Unknown error');
          stats.failed++;
          updateStats();
          log(`❌ ${eventType} failed (${response.status}): ${errorText}`, 'error');
          return null;
        }

        const result = await response.json();

        if (result.duplicate) {
          stats.duplicate++;
          updateStats();
          log(`⊗ ${eventType} marked as duplicate`, 'warning');
        } else if (result.noise) {
          log(`⚠ ${eventType} marked as noise: ${result.reason}`, 'warning');
        } else if (result.processed) {
          stats.success++;
          updateStats();
          log(`✓ ${eventType} processed successfully (Journey: ${result.journeyId}, Touchpoint: ${result.touchpointId})`, 'success');
        } else {
          log(`⚠ ${eventType} returned unexpected response: ${JSON.stringify(result)}`, 'warning');
        }

        return result;
      } catch (err) {
        stats.failed++;
        updateStats();
        log(`❌ ${eventType} network error: ${err.message}`, 'error');
        return null;
      }
    }

    function sendPageView() {
      sendEvent('PAGE_VIEW', { path: '/test', referrer: document.referrer });
    }

    function sendClick() {
      sendEvent('CLICK', { element: 'button', label: 'Test Button' });
    }

    function sendFormSubmit() {
      sendEvent('FORM_SUBMIT', { formId: 'test-form', fields: ['email', 'name'] });
    }

    function sendPurchase() {
      sendEvent('PURCHASE', { orderId: 'TEST-' + Date.now(), total: 99.99, currency: 'USD' });
    }

    function sendBounce() {
      sendEvent('BOUNCE', { timeOnPageSeconds: 2.5 }, { keepalive: true });
    }

    function sendMinimalEvent() {
      const apiUrl = document.getElementById('apiUrl').value;
      const minimalPayload = { eventType: 'PAGE_VIEW' };

      log('Sending minimal event (Bug #1 test: only eventType)...', 'info');

      fetch(`${apiUrl}/api/raw-events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(minimalPayload),
      })
        .then(async (response) => {
          if (response.status === 500) {
            const error = await response.text();
            if (error.includes('Cannot map') && error.includes('boolean')) {
              log('❌ Bug #1 CONFIRMED: Primitive boolean crash on missing requireSession', 'error');
            } else {
              log(`❌ 500 error (not Bug #1): ${error}`, 'error');
            }
          } else if (response.status === 400) {
            const error = await response.text();
            log(`⚠ 400 validation error (expected): ${error}`, 'warning');
          } else if (response.ok) {
            log('✓ Minimal event accepted! Bug #1 is fixed.', 'success');
          } else {
            log(`⚠ Unexpected status ${response.status}`, 'warning');
          }
        })
        .catch((err) => {
          log(`❌ Network error: ${err.message}`, 'error');
        });
    }

    function sendCustomEvent() {
      const eventType = document.getElementById('customEventType').value;
      let payload = {};
      try {
        payload = JSON.parse(document.getElementById('customPayload').value);
      } catch (e) {
        log('❌ Invalid JSON in custom payload', 'error');
        return;
      }
      sendEvent(eventType, payload);
    }

    function sendWithKeepalive() {
      const eventType = document.getElementById('customEventType').value;
      let payload = {};
      try {
        payload = JSON.parse(document.getElementById('customPayload').value);
      } catch (e) {
        log('❌ Invalid JSON in custom payload', 'error');
        return;
      }
      sendEvent(eventType, payload, { keepalive: true });
    }

    async function runStressTest() {
      const count = parseInt(document.getElementById('stressCount').value);
      const delay = parseInt(document.getElementById('stressDelay').value);

      log(`🚀 Starting stress test: ${count} events with ${delay}ms delay`, 'info');

      for (let i = 0; i < count; i++) {
        const eventType = ['PAGE_VIEW', 'CLICK', 'FORM_SUBMIT'][Math.floor(Math.random() * 3)];
        await sendEvent(eventType, { testIndex: i });

        if (delay > 0 && i < count - 1) {
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }

      log(`✓ Stress test complete: ${count} events sent`, 'success');
    }

    // Log initial message
    log('Tracking client test tool ready. Backend: ' + document.getElementById('apiUrl').value, 'success');
  </script>
</body>
</html>
